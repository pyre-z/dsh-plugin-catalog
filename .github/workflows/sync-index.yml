name: Sync index.json

on:
  schedule:
    # 两条 cron 错开 10 小时：GitHub 对 scheduled workflow 有 5～8 小时排队延迟，
    # 单条 cron 的实际落地时刻不可控，两条配合可保证最长陈旧约 12 小时
    - cron: "17 3 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 抓取并校验最新快照
        id: sync
        run: |
          bash sync.sh
          if git diff --quiet -- index.json .version; then
            echo "已是最新版本，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            VER=$(cat .version)
            echo "检测到新版本：${VER}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送
        if: steps.sync.outputs.changed == 'true'
        env:
          VER: ${{ steps.sync.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA=$(sha256sum index.json | cut -d' ' -f1)
          {
            echo ":arrow_up: 同步 dsh-plugin-catalog 至 ${VER}"
            echo "- 更新 index.json（版本 ${VER}）"
            echo "- sha256: ${SHA}"
            echo "- 更新 .version"
            echo "- 来源: https://cdn.jsdelivr.net/npm/dsh-plugin-catalog@${VER}/index.json"
          } > "$RUNNER_TEMP/commit-msg.txt"
          git add index.json .version
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          git push

      - name: 安装 ossutil
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/ossutil.zip" \
            https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          sudo install -m 0755 \
            "$RUNNER_TEMP/ossutil/ossutil-2.2.1-linux-amd64/ossutil" /usr/local/bin/ossutil
          ossutil version

      - name: 上传到阿里云 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_PREFIX: ${{ vars.OSS_PREFIX }}
        run: bash scripts/upload-oss.sh

      - name: 输出摘要
        run: |
          {
            echo "### 同步结果"
            echo ""
            echo "- 本地版本: \`$(cat .version)\`"
            echo "- index.json 大小: $(stat -c%s index.json) 字节"
            echo "- sha256: \`$(sha256sum index.json | cut -d' ' -f1)\`"
            echo "- 是否写入提交: \`${{ steps.sync.outputs.changed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
